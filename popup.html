<!DOCTYPE html>
<html>
<head>
  <title>Document Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 12px;
      width: 220px;
      background-color: #101010; /* Vesper base00 */
      color: #FFFFFF; /* Vesper base05 */
      border: 1px solid #232323; /* Vesper base02 */
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }
    h3 {
      margin: 0 0 12px 0;
      padding: 0;
      font-size: 16px;
      color: #FFC799; /* Vesper base0D - Vesper accent */
      text-align: center;
      padding-bottom: 8px;
      border-bottom: 1px solid #232323; /* Vesper base02 */
    }
    .section {
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 12px;
      color: #A0A0A0; /* Vesper base04 */
      margin: 0 0 6px 0;
      padding-left: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .option {
      padding: 10px;
      cursor: pointer;
      margin-bottom: 6px;
      border-radius: 6px;
      transition: all 0.2s ease;
      background-color: #1C1C1C; /* Vesper base01 */
      color: #FFFFFF; /* Vesper base05 */
      font-size: 14px;
      display: flex;
      align-items: center;
    }
    .option:hover {
      background-color: #232323; /* Vesper base02 */
      transform: translateY(-1px);
    }
    .option:active {
      transform: translateY(0);
    }
    .flag {
      margin-right: 8px;
      font-size: 16px;
      display: inline-block;
      width: 20px;
      height: 20px;
      line-height: 20px;
      text-align: center;
      background-color: #838383; /* Vesper base0C */
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h3>Document Generator</h3>
  
  <div class="section">
    <div class="section-title">SPAIN</div>
    <div class="option" data-type="NIF"><span class="flag">ES</span> NIF</div>
    <div class="option" data-type="NIE"><span class="flag">ES</span> NIE</div>
    <div class="option" data-type="CIF"><span class="flag">ES</span> CIF</div>
  </div>
  
  <div class="section">
    <div class="section-title">ITALY</div>
    <div class="option" data-type="codiceFiscale"><span class="flag">IT</span> Codice Fiscale</div>
    <div class="option" data-type="partitaIVA"><span class="flag">IT</span> Partita IVA</div>
  </div>
  
  <script src="codiceFiscale.js"></script>
  <script src="popup.js"></script>
</body>
</html>
